name: Update GitHub stats card

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-github-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch github-stats
        run: curl -sSf -o github-stats.svg "https://github-stats-extended.vercel.app/api?username=Jiksi&show_icons=true&theme=github_dark&hide_border=true&rank_icon=github"

      - name: Fetch top-langs
        run: curl -sSf -o top-langs.svg "https://github-stats-extended.vercel.app/api?username=Jiksi&show_icons=true&theme=github_dark&hide_border=true&rank_icon=github"

      - name: Fetch streak-stats
        run: curl -sSf -o streak-stats.svg "https://streak-stats.demolab.com?user=Jiksi&theme=github-dark-blue&hide_border=true"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg top-langs.svg streak-stats.svg
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update GitHub stats"
            git push
          fi
